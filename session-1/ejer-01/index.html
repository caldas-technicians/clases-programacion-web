<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio DOM</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .contenedor {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .destacado {
            color: white;
            background-color: #2563eb;
            padding: 10px;
            border-radius: 5px;
        }

        li {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <main class="contenedor">
        <h1 id="titulo">Laboratorio del DOM</h1>

        <p id="mensaje">
            Este es un párrafo que puedes modificar con JavaScript.
        </p>

        <button id="btnTexto">Cambiar texto</button>
        <button id="btnColor">Cambiar color</button>
        <button id="btnCrear">Crear elemento</button>

        <!-- Laboratorios -->
        <button id="btnTitulo">Cambiar titulo</button>

        <hr>

        <h2>Lista de tareas</h2>

        <input type="text" id="nuevaTarea" placeholder="Escribe una tarea">

        <button id="btnAgregar">Agregar tarea</button>

        <ul id="listaTareas">
            <li>Aprender HTML</li>
            <li>Practicar CSS</li>
            <li>Explorar JavaScript</li>
        </ul>

        <button id="btnEliminar">Eliminar última tarea</button>

        <div id="resultado"></div>
    </main>


    <script src="main.js"></script>

</body>

</html>
