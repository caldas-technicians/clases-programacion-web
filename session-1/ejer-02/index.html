<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Festival del Mundo</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="inspector.js" defer></script>
</head>

<body>
    <header>
        <h1 id="titulo">Festival del Mundo</h1>
        <p class="lema">Cine hecho en casa</p>
    </header>
    <main>
        <p id="resumen"></p>
        <section id="programacion">
            <article class="festival" data-genero="animacion">
                <img src="img/img01.webp" alt="Monjes soltando faroles de papel iluminados durante una noche de velas">
                <h2>La última hoja</h2>
                <p class="duracion">12 min</p>
            </article>
            <article class="festival" data-genero="documental">
                <img src="img/img02.webp" alt="Multitud frente a un escenario con fuegos artificiales en un festival nocturno">
                <h2>Café de altura</h2>
                <p class="duracion">18 min</p>
            </article>
            <article class="festival" data-genero="animacion">
                <img src="img/img03.webp" alt="Globos aerostáticos de colores sobre un lago bajo un cielo despejado">
                <h2>Papel y tinta</h2>
                <p class="duracion">7 min</p>
            </article>
            <article class="festival" data-genero="ficcion">
                <img src="img/img04.webp" alt="Aficionados con banderas de México reunidos ante una pantalla gigante en una plaza">
                <h2>La espera</h2>
                <p class="duracion">21 min</p>
            </article>
            <article class="festival" data-genero="ficcion">
                <img src="img/img05.webp" alt="Bailarinas con trajes de cuadros y tocados de piña en un desfile">
                <h2>Niebla</h2>
                <p class="duracion">15 min</p>
            </article>
        </section>
        <a id="entradas" href="#">Comprar entradas</a>
    </main>
    <footer>
        <p>Contacto: festival@ejemplo.com</p>
    </footer>
</body>

</html>
